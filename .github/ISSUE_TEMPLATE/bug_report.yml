name: Bug report
description: Report a reproducible problem with Xbox Cloud Toolkit
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please do not include account credentials, tokens, or other private information."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open Xbox Cloud Gaming\n2. Start a game\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Toolkit version
      placeholder: "2.1.1"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Edge / Chrome / Firefox"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Tampermonkey
        - Browser extension
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove any personal or sensitive information.
